name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# A release is never cancelled once started: one cut off between its
# binaries and its attestations is half published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can be pushed on any commit: what is released has passed the same
  # checks as a pull request
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  e2e:
    name: End-to-end
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  release:
    name: Build, attest and publish
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    permissions:
      # Create the release
      contents: write
      # Sign the build provenance as this workflow
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      # The flags in the Makefile make a build reproducible: the same tag
      # and toolchain give the same bytes anywhere.
      - name: Build
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          mkdir dist
          for arch in amd64 arm64; do
            make build GOARCH="$arch" VERSION="$TAG"
            mv "bin/openbao-plugin-auth-tailscale_linux_${arch}" \
              "dist/openbao-plugin-auth-tailscale_${version}_linux_${arch}"
          done
          (cd dist && sha256sum openbao-plugin-auth-tailscale_* > SHA256SUMS && cat SHA256SUMS)

      # The release notes are the version's section of the changelog; a
      # tag without one is a mistake
      - name: Release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v version="$version" '
            /^## \[/ { printing = ($2 == "[" version "]") ; next }
            printing { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi

      - name: Attest the binaries
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/openbao-plugin-auth-tailscale_*

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist/*
