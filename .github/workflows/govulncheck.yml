name: Vulnerabilities

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # New advisories appear without a change to the code
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

# A newer push to a pull request replaces the run it supersedes
concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the findings to code scanning
      security-events: write
      # only required in private repositories
      actions: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # With -format sarif, govulncheck reports findings without failing;
      # code scanning tracks them. The version is pinned in go.mod's tool block.
      - name: Run govulncheck
        id: govulncheck
        run: go tool govulncheck -format sarif ./... > govulncheck.sarif

      # Pull requests from forks get no security-events permission
      - name: Upload findings
        id: upload-sarif
        if: >-
          github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
